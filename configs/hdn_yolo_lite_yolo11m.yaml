# HDN-YOLO-Lite detector configuration (YOLO11m + LMSCSP-DeepOnly).
#
# LMSCSP-DeepOnly replaces the two deep-stage P5 blocks only:
#   - layer 8  : backbone deep semantic block at P5/32
#   - layer 22 : neck-side deep P5 fusion block
# All shallow P3/P4 paths, the remaining neck blocks, and the detection
# head are kept identical to YOLO11m.
#
# This file is used by train.py together with hdn_yolo_lite.modules,
# which builds the C3k2LMS blocks and swaps them into the two positions above.

nc: 3

scales:
  # [depth, width, max_channels]
  m: [0.50, 1.00, 512]

scale: m

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2LMS, [1024, True]] # 8  LMSCSP-DeepOnly (backbone P5)
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2LMS, [1024, True]] # 22 LMSCSP-DeepOnly (neck P5)
  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
